name: Deploy Portfolio + Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 1. Build React portfolio ──────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install portfolio deps
        run: npm ci
        working-directory: portfolio

      - name: Build portfolio
        run: npm run build
        working-directory: portfolio
        env:
          # portfolio is at root /, so no base path needed
          VITE_BASE: /

      # ── 2. Build Zola blog ────────────────────────────────────────────────
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2

      - name: Build Zola blog
        run: zola build --base-url https://${{ github.repository_owner }}.github.io/blog
        working-directory: blog

      # ── 3. Merge into single dist ─────────────────────────────────────────
      - name: Assemble output
        run: |
          mkdir -p dist
          # Portfolio goes to root
          cp -r portfolio/dist/. dist/
          # Blog goes to /blog/
          mkdir -p dist/blog
          cp -r blog/public/. dist/blog/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
